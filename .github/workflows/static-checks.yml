name: Server and RK3588 source integrity
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile both Python source trees
        run: python -m compileall -q server rk3588 tests
      - name: Check repository layout
        run: python -m unittest discover -s tests -p 'test_layout.py' -v
      - name: Verify original AutoDL file identity
        run: python server/tools/verify_source_manifest.py
      - name: Verify original board file identity
        run: cd rk3588 && sha256sum -c docs/SOURCE_SHA256.txt
